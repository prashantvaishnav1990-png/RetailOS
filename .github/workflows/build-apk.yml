name: Build RetailOS APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.7.12'
          channel: stable

      - name: Extract Android project
        run: |
          mkdir -p "$GITHUB_WORKSPACE/project"
          unzip -q "$GITHUB_WORKSPACE/RetailOS_Android_Project.zip" -d "$GITHUB_WORKSPACE/project"

          PUBSPEC=$(find "$GITHUB_WORKSPACE/project" -type f -name "pubspec.yaml" -print -quit)

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml not found"
            find "$GITHUB_WORKSPACE/project" -maxdepth 3 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project at: $PROJECT_DIR"

      - name: Get dependencies
        run: |
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RetailOS-APK
          path: "$PROJECT_DIR/build/app/outputs/flutter-apk/app-release.apk"
